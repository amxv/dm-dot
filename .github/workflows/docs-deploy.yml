name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm-dot-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install ZueDocs
        run: bun install --frozen-lockfile
      - name: Check ZueDocs
        run: bun run check
      - name: Build ZueDocs
        run: bun run build
      - name: Prepare static deployment
        run: node scripts/prepare-prebuilt.mjs
      - name: Deploy docs only
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.DM_DOT_DOCS_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.DM_DOT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.DM_DOT_DOCS_VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          mv docs/.vercel/output .vercel/output
          npx --yes vercel@65.1.0 deploy --prebuilt --prod --yes --non-interactive --token "$VERCEL_TOKEN"
