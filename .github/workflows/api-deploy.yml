name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "vercel.json"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm-dot-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Go API only
        env:
          VERCEL_TOKEN: ${{ secrets.DM_DOT_API_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.DM_DOT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.DM_DOT_API_VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@65.1.0 deploy --prod --yes --non-interactive --token "$VERCEL_TOKEN"
